spring.application.name=gateway

server.port=7777

spring.cloud.gateway.routes[0].id=email-service
spring.cloud.gateway.routes[0].uri=http://email-service:8083
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/emails/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=JwtValidation

spring.cloud.gateway.routes[1].id=project-service
spring.cloud.gateway.routes[1].uri=http://project-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/projects/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=JwtValidation

spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=http://user-service:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1]=JwtValidation

spring.cloud.gateway.routes[4].id=analytics-service
spring.cloud.gateway.routes[4].uri=http://analytics-service:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/analytics/emails/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[4].filters[1]=JwtValidation

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=http://payment-service:8087
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[5].filters[1]=JwtValidation

spring.cloud.gateway.routes[6].id=template-service
spring.cloud.gateway.routes[6].uri=http://template-service:8089
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/templates/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[6].filters[1]=JwtValidation

spring.cloud.gateway.routes[7].id=ai-service
spring.cloud.gateway.routes[7].uri=http://ai-service:8090
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[7].filters[1]=JwtValidation

spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=http://auth-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.default-filters[0]=AddResponseHeader=Cross-Origin-Opener-Policy,same-origin-allow-popups

