syntax = "proto3";

option java_multiple_files = true;
option java_package = "project";

service ProjectService {
    rpc ProjectValidation (ProjectValidationRequest) returns (ProjectValidationResponse);
    rpc ResolveApiKey(ApiKeyRequest) returns (ApiKeyResponse);
}

message ProjectValidationRequest {
    string projectId = 1;
    string apiKey = 2;
}

message ProjectValidationResponse {
    bool isValid = 1;
}

message ApiKeyRequest {
    string apiKey = 1;
}

message ApiKeyResponse {
    bool valid = 1;
    string projectId = 2;
    string userId = 3;
}